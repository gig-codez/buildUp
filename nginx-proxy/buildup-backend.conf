# ---------------------------------------------------------------------------
# One-time VPS setup
# ---------------------------------------------------------------------------
#
# Copying these two files to /opt/nginx-proxy on the VPS, creating the
# shared network, and reloading nginx are all handled automatically by
# the "sync-nginx" job in .github/workflows/deploy.yml on every push to
# main/escrow-dev. The only thing that stays manual is the very first
# cert issuance, because nginx refuses to start at all if a referenced
# ssl_certificate file doesn't exist yet — it won't just skip those
# server blocks and leave :80 up. Do this once:
#
# 1. Push to main or escrow-dev (or run the workflow manually) so the
#    sync-nginx job copies docker-compose.yml and this file to
#    /opt/nginx-proxy on the VPS. It will detect the missing certs and
#    fail on purpose at that point — that's expected. The rest of the
#    deploy is blocked until certs exist, which is what you want.
#
# 2. SSH into the VPS and comment out (or delete) both "listen 443 ssl
#    ..." server blocks in the copy that's now sitting at
#    /opt/nginx-proxy/buildup-backend.conf (edit the copy on the VPS,
#    not the repo — the next successful CI run overwrites it with the
#    unmodified version from the repo anyway):
#      mkdir -p /var/www/certbot
#      cd /opt/nginx-proxy && docker compose up -d
#      sudo certbot certonly --webroot -w /var/www/certbot \
#        -d api.buildupuganda.com -d dev-api.buildupuganda.com
#
# 3. Once both certs exist under /etc/letsencrypt/live/..., just re-run
#    the workflow (push again, or re-run from the Actions tab). It will
#    copy the full config back over your temporary edit, see the certs
#    are there, and start/reload nginx with HTTPS enabled — no more
#    manual steps needed after that.
#
# 4. Renewal (certbot on the host, nginx in a container — so the renewal
#    hook needs to restart the container, not reload a host process):
#      echo '0 3 * * * root certbot renew --webroot -w /var/www/certbot \
#        --deploy-hook "docker restart buildup-nginx"' \
#        | sudo tee /etc/cron.d/certbot-buildup
