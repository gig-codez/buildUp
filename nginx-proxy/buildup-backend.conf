# nginx-proxy/buildup-backend.conf
#
# Reverse proxy for the BuildUp backend. Runs itself as a container (see
# nginx-proxy/docker-compose.yml) on the shared "buildup-net" Docker
# network, and reaches the two app containers by container name/DNS
# rather than via host ports:
#   - api.buildupuganda.com      -> buildup-backend:4000          (production)
#   - dev-api.buildupuganda.com -> buildup-backend-staging:5001  (staging)
#
# Ports match each container's PORT (from its own .env). Update the
# upstream ports below if either .env's PORT ever changes. Both
# container names must match CONTAINER_NAME as set in the deploy
# workflow, and both containers must be on "buildup-net"
# (docker-compose.deploy.yml handles that).
#
# Certs: obtained via `certbot certonly --webroot` on the HOST (not
# `--nginx`, since nginx itself runs in a container here) — see the
# webroot path mounted below and the setup notes at the bottom of this
# file.

# Required so the Upgrade/Connection headers below work for both plain
# HTTP/1.1 keep-alive requests and any future WebSocket upgrade (the app
# ships a websocket route that isn't wired up yet, but this makes it a
# drop-in when it is).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# Production — api.buildupuganda.com
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.buildupuganda.com;

    # Certbot HTTP-01 challenge path.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

