# ---------------------------------------------------------------------------
# Staging — dev-api.buildupuganda.com
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dev-api.buildupuganda.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

